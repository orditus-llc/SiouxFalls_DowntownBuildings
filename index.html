<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downtown Sioux Falls, SD Buildings</title>

  <!-- CesiumJS from a CDN, pinned to an exact version -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

    /* ---- Control panel (top-left) ---- */
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      width: 270px; max-width: calc(100% - 20px); max-height: calc(100% - 20px);
      overflow-y: auto; box-sizing: border-box;
      background: rgba(255, 255, 255, 0.95); color: #222;
      font: 13px/1.4 sans-serif; padding: 10px 12px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    #panel h2 { margin: 0; font-size: 15px; }
    #panel h3 { margin: 12px 0 4px; font-size: 13px; border-top: 1px solid #ddd; padding-top: 8px; }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #panel input[type=range] { width: 100%; margin: 0; }
    #panel select, #panel button { font: inherit; width: 100%; padding: 3px; }
    #panel .row { display: flex; justify-content: space-between; align-items: center; }
    #panel .muted { color: #666; font-size: 12px; }
    #panel input[type=color] { width: 26px; height: 20px; padding: 0; border: 1px solid #999; }
    #panel .swatch { width: 16px; height: 16px; border: 1px solid #232323; display: inline-block; flex: none; }
    #panel .typeRow { display: flex; align-items: center; gap: 6px; }
    #panel .typeRow label { flex: 1; }
    #toggle { width: auto !important; padding: 1px 8px !important; }
    #panel.collapsed #controls { display: none; }

    /* ---- Two-handle range slider: two range inputs stacked on one track ---- */
    .dual { position: relative; height: 22px; }
    .dual::before, .dual .fill {
      content: ""; position: absolute; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
    }
    .dual::before { left: 0; right: 0; background: #ccc; }      /* full track */
    .dual .fill { background: #3388ff; }                           /* selected part */
    #panel .dual input[type=range] {
      position: absolute; left: 0; top: 0; width: 100%; height: 22px; margin: 0;
      background: none; pointer-events: none;                      /* only the handles are clickable */
      -webkit-appearance: none; appearance: none;
    }
    .dual input[type=range]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    .dual input[type=range]::-moz-range-track { height: 4px; background: transparent; }
    .dual input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto; cursor: pointer;
      width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
      background: #fff; border: 2px solid #3388ff; box-sizing: border-box;
    }
    .dual input[type=range]::-moz-range-thumb {
      pointer-events: auto; cursor: pointer;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; border: 2px solid #3388ff; box-sizing: border-box;
    }
    #panel .allRow { font-weight: bold; }
    [hidden] { display: none !important; }  /* keep hidden items hidden, even flex labels */
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="panel">
    <div class="row">
      <h2>Downtown Buildings</h2>
      <button id="toggle" title="Show or hide the controls">Hide</button>
    </div>
    <div id="controls">
      <div class="muted" id="count">Loading buildings...</div>

      <h3>Color buildings by</h3>
      <select id="colorMode">
        <option value="stories">Number of stories</option>
        <option value="type">Building type</option>
        <option value="single">One color for all</option>
      </select>
      <label id="singleColorRow" hidden>Building color <input type="color" id="singleColor" value="#3388ff"></label>
      <div id="storiesLegend"></div>
      <div class="row"><span>Transparency</span><span id="alphaOut">0%</span></div>
      <input type="range" id="alpha" min="0" max="80" step="5" value="0">

      <h3>Building height (ft)</h3>
      <div class="row"><span>Range</span><span id="hOut"></span></div>
      <div class="dual">
        <div class="fill" id="hFill"></div>
        <input type="range" id="hMin" step="1" aria-label="Minimum height">
        <input type="range" id="hMax" step="1" aria-label="Maximum height">
      </div>

      <h3>Number of stories</h3>
      <div class="row"><span>Range</span><span id="sOut"></span></div>
      <div class="dual">
        <div class="fill" id="sFill"></div>
        <input type="range" id="sMin" step="1" aria-label="Minimum stories">
        <input type="range" id="sMax" step="1" aria-label="Maximum stories">
      </div>

      <h3>Building type</h3>
      <div class="muted">Uncheck to hide. Click a color box to change that type's color.</div>
      <div id="typeList"></div>

      <h3></h3>
      <button id="reset">Reset all</button>
    </div>
  </div>

  <script>
    // Your Cesium ion token (ion.cesium.com -> Access Tokens).
    // The deploy workflow (.github/workflows/deploy.yml) swaps the
    // placeholder below for the CESIUM_TOKEN repository secret.
    // Anyone can read it on a public page, so in the ion dashboard
    // restrict it to your GitHub Pages URL before publishing.
    // Without a token you get a flat globe.
    // Token "SF_Orditus_GitHub" expires May 17, 2027: make a new one before then.
    const token = "PASTE_CESIUM_TOKEN"; // replaced at deploy time by GitHub Actions (secret CESIUM_TOKEN)
    const hasToken = !token.startsWith("PASTE");
    if (hasToken) Cesium.Ion.defaultAccessToken = token;

    // The 3D globe: OpenStreetMap streets, draped over Cesium's world terrain
    // when there's a token (a flat globe without one).
    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: hasToken ? Cesium.Terrain.fromWorldTerrain() : undefined,
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
      ),
      baseLayerPicker: false,
      animation: false,   // no clock widgets: this map has no time data
      timeline: false,
    });

    // ---------------------------------------------------------------------
    // Color settings
    // ---------------------------------------------------------------------

    // Graduated colors copied from the QGIS project
    // "1st Attempt Application.qgz", layer "Graduated Colors"
    // (field NUMBERSTORIES, Natural Breaks / Jenks).
    // QGIS rule: a building is in a class if lower < stories <= upper
    // (the first class also includes its lower value).
    const storyClasses = [
      { lower: 1, upper: 1,  label: "1 Story",      color: "#ffffb2" },
      { lower: 1, upper: 2,  label: "2 Stories",    color: "#fecc5c" },
      { lower: 2, upper: 4,  label: "3-4 Stories",  color: "#fd8d3c" },
      { lower: 4, upper: 7,  label: "5-7 Stories",  color: "#f03b20" },
      { lower: 7, upper: 11, label: "8-11 Stories", color: "#bd0026" },
    ];

    function storiesColor(stories) {
      const match = storyClasses.find((c, i) =>
        (i === 0 ? stories >= c.lower : stories > c.lower) && stories <= c.upper);
      return match ? match.color : "#a0a0a0"; // gray if outside every class
    }

    // Building types. The City's STRUCTURE codes are grouped by hundreds
    // (1xx = residential, 5xx = commercial, ...). Users can change these colors.
    const typeGroups = {
      1: { label: "Residential",                color: "#009e73" },
      2: { label: "Multi-Family Residential",   color: "#56b4e9" },
      3: { label: "Office & Government",        color: "#0072b2" },
      4: { label: "Institutional & Community",  color: "#cc79a7" },
      5: { label: "Commercial & Retail",        color: "#e69f00" },
      6: { label: "Industrial",                 color: "#d55e00" },
      7: { label: "Green Space Structure",      color: "#7f7f7f" },
      9: { label: "Rural",                      color: "#a6761d" },
    };

    // Names for the City's STRUCTURE codes, from the City's building layer
    // (gis.siouxfalls.gov ... Data/Property/MapServer/5, domain WS1_StructureCodeType).
    const structureNames = {
      110: "Single Family Home", 121: "Twin Home", 122: "Townhome - 3 or more units",
      130: "Accessory Housing Unit", 140: "Manufactured Housing",
      150: "Other Specialized Residential Structure", 151: "Barracks", 152: "Dormitory",
      190: "Single Family Accessory Structure", 210: "Duplex",
      220: "Multi-Family - 3 or more units", 230: "Multi-family Community Building",
      290: "Multi-Family Accessory Structure", 310: "Office - 1 tenant",
      311: "Office - 1 tenant with drive-thru", 320: "Bank", 321: "Bank with drive-thru",
      330: "Office - 2 or more tenants", 331: "Office - 2 or more tenants with drive-thru",
      350: "Government Administration Building", 361: "Jail, Penitentiary, or Juvenile Detention",
      362: "Bus Stop or Transfer Facility", 363: "Public Safety", 364: "Air Terminal",
      365: "Bus Maintenance Facility", 366: "Post Office",
      367: "Government Maintenance/Storage Shop", 370: "Covered or Multi-Story Parking Ramp",
      380: "Neighborhood Public Utilities", 390: "Office or Public Service Accessory Structure",
      410: "Public Assembly Structure", 411: "Indoor Games Facility",
      412: "Outdoor Games Facility", 413: "Convention Center", 414: "Other Community Structure",
      420: "House of Worship or Cemetery Structure", 431: "Hospital",
      432: "Large Medical Clinic", 433: "Nursing Home", 434: "Assisted Living",
      435: "Group Home", 436: "Funeral Home", 440: "Daycare Center",
      451: "School - Elementary or Secondary", 452: "School - College or University",
      453: "School - Trade or Specialty", 461: "Library", 462: "Museum", 463: "Zoo",
      470: "Health Club or Gymnastics Center", 480: "Human Services Facility",
      490: "Institutional Accessory Structure", 511: "General Retail or Services",
      512: "Gas Station or Auto Service", 513: "Grocery Store",
      514: "Restaurant, Bar, or Lounge", 515: "Hotel, Motel, or Resort", 516: "Movie Theater",
      520: "Mixed Use - Suburban", 530: "Mixed Use - Downtown/Village", 531: "Strip Mall",
      532: "Community Commercial Center (not enclosed)", 533: "Regional Commercial Center",
      534: "Super-Regional Commercial Center", 590: "Commercial Accessory Structure",
      620: "Light Assembly and Processing", 630: "Heavy Industrial",
      631: "Assembly or Construction-type Plant", 632: "Processing Plant",
      641: "Mini-Storage", 642: "Warehouse", 643: "Tank Structure", 651: "Railroad Facility",
      652: "Landfill", 653: "Incinerator", 654: "Hazardous Waste Facility",
      655: "Sewer or Water Treatment Plant", 656: "Air Transportation Facility",
      657: "Tower or Related facility", 690: "Industrial Accessory Structure",
      710: "Green Space Primary Structure", 790: "Green Space Accessory Structure",
      990: "Rural Structure",
    };

    // Cesium works in meters, but the data is in feet.
    // Heights are converted only for drawing; everything shown stays in feet.
    const FEET_TO_METERS = 0.3048;

    // ---------------------------------------------------------------------
    // Load the buildings
    // ---------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const buildings = [];   // one plain object per building, used by the filters

    // Live data from the City of Sioux Falls GIS server, pulled on every visit.
    // This is the JavaScript version of get_buildings.py plus the QGIS edits.
    const BOUNDARY_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Community/MapServer/6"; // Downtown Business District
    const LAYER_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Property/MapServer/5";     // building footprints
    const ADDRESS_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Property/MapServer/0";   // address points: business name (ALIAS), YEARBUILT
    const PARCEL_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Property/MapServer/1";    // parcels: owner name (OWNNAME1)
    const PAGE_SIZE = 1000; // the server's maximum per request

    // POST rather than GET: the boundary polygon is too long to fit in a URL.
    async function query(layerUrl, params) {
      const resp = await fetch(layerUrl + "/query", { method: "POST", body: new URLSearchParams(params) });
      if (!resp.ok) throw new Error(`HTTP ${resp.status} from ${layerUrl}`);
      const json = await resp.json();
      if (json.error) throw new Error(`Server error: ${JSON.stringify(json.error)}`);
      return json;
    }

    async function getBoundary() {
      // The server errors without outFields, so ask for just the ID.
      const result = await query(BOUNDARY_URL, { where: "1=1", outFields: "OBJECTID", outSR: 4326, f: "json" });
      if ((result.features || []).length !== 1)
        throw new Error(`Expected 1 boundary shape, got ${(result.features || []).length}`);
      return result.features[0].geometry;
    }

    // Every feature of a layer inside the downtown boundary, as GeoJSON features.
    async function fetchLayer(layerUrl, boundary, outFields) {
      const features = [];
      while (true) {
        const page = await query(layerUrl, {
          where: "1=1",
          outFields,
          orderByFields: "OBJECTID", // fixed order so paging is consistent
          resultOffset: features.length,
          resultRecordCount: PAGE_SIZE,
          outSR: 4326,
          f: "geojson",
          geometry: JSON.stringify(boundary),
          geometryType: "esriGeometryPolygon",
          inSR: 4326,
          spatialRel: "esriSpatialRelIntersects", // buildings touching the edge are kept too
        });
        const batch = page.features || [];
        features.push(...batch);
        if (batch.length < PAGE_SIZE) break;
      }
      return features;
    }

    // The edits that used to be done by hand in QGIS.
    function cleanBuildings(features) {
      const kept = [];
      for (const f of features) {
        const p = f.properties;
        // Drop buildings with no height or stories (the City's "Proposed"
        // placeholders): there's nothing to draw for them.
        if (typeof p.BUILDINGTOPELEVATION !== "number" ||
            typeof p.GROUNDELEVATION !== "number" ||
            typeof p.NUMBERSTORIES !== "number") continue;

        // Elevations are in feet above sea level; height = top - ground, to 0.01 ft (as in QGIS).
        p["GROUNDELEVATION (ft)"] = p.GROUNDELEVATION;
        p["BUILDINGTOPELEVATION (ft)"] = p.BUILDINGTOPELEVATION;
        p["BUILDINGHEIGHT (ft)"] = Math.round((p.BUILDINGTOPELEVATION - p.GROUNDELEVATION) * 100) / 100;
        delete p.GROUNDELEVATION;
        delete p.BUILDINGTOPELEVATION;

        // Dates arrive as milliseconds since 1970; turn them into YYYY-MM-DD.
        if (typeof p.OCCUPIEDDATE === "number")
          p.OCCUPIEDDATE = new Date(p.OCCUPIEDDATE).toISOString().slice(0, 10);

        kept.push(f);
      }
      return { type: "FeatureCollection", features: kept };
    }

    // ---- Matching names, owners and build years to each building ----

    // Is point [lon, lat] inside a GeoJSON Polygon or MultiPolygon? (ray casting; holes handled)
    function pointInGeometry([x, y], geom) {
      if (!geom) return false;
      const polygons = geom.type === "Polygon" ? [geom.coordinates] :
                       geom.type === "MultiPolygon" ? geom.coordinates : [];
      return polygons.some((rings) => {
        let inside = false;
        for (const ring of rings) {
          for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
            const [xi, yi] = ring[i], [xj, yj] = ring[j];
            if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
          }
        }
        return inside;
      });
    }

    // A point near the middle of a building (average of its outline's corners).
    function centerOf(geom) {
      const ring = geom.type === "Polygon" ? geom.coordinates[0] : geom.coordinates[0][0];
      const pts = ring.slice(0, -1); // the last corner repeats the first
      return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
    }

    const unique = (list) => [...new Set(list.filter((v) => v && String(v).trim()))];

    // For every building: names, addresses, build year (address points) and owners (parcels).
    // Returns a Map of building OBJECTID -> info.
    function matchBuildingInfo(buildingFeatures, addressPoints, parcels) {
      const info = new Map();
      for (const f of buildingFeatures) {
        const center = centerOf(f.geometry);

        // Parcel(s) under the middle of the building. Condos can stack several parcels on one spot.
        const myParcels = parcels.filter((pc) => pointInGeometry(center, pc.geometry));

        // Address points inside the footprint; if none, the address points on the same parcel.
        let myAddresses = addressPoints.filter((a) => a.geometry && pointInGeometry(a.geometry.coordinates, f.geometry));
        if (!myAddresses.length) {
          const tags = new Set(myParcels.map((pc) => pc.properties.TAG));
          myAddresses = addressPoints.filter((a) => tags.has(a.properties.TAG));
        }

        const years = myAddresses.map((a) => parseInt(a.properties.YEARBUILT, 10)).filter((y) => y > 1800);
        info.set(f.properties.OBJECTID, {
          names: unique(myAddresses.map((a) => a.properties.ALIAS)),
          addresses: unique(myAddresses.map((a) => a.properties.ADDRESS).concat(myParcels.map((pc) => pc.properties.ADDRESS))),
          owners: unique(myParcels.map((pc) => pc.properties.OWNNAME1)),
          yearBuilt: years.length ? Math.min(...years) : null,
        });
      }
      return info;
    }

    // Make text from the City's data safe to put inside the info box HTML.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Show up to `max` items, then "+ N more".
    function listHtml(items, max) {
      if (!items.length) return "Unknown";
      const shown = items.slice(0, max).map(esc).join("<br>");
      return items.length > max ? `${shown}<br><i>+ ${items.length - max} more</i>` : shown;
    }

    async function loadEverything() {
      const boundary = await getBoundary();
      // Names and owners are extras: if those layers fail, still show the buildings.
      const optional = (promise, what) => promise.catch((err) => { console.warn(`Couldn't load ${what}:`, err); return []; });
      const [buildingFeatures, addressPoints, parcels] = await Promise.all([
        fetchLayer(LAYER_URL, boundary, "*"),
        optional(fetchLayer(ADDRESS_URL, boundary, "TAG,ADDRESS,ALIAS,YEARBUILT"), "address points"),
        optional(fetchLayer(PARCEL_URL, boundary, "TAG,ADDRESS,OWNNAME1"), "parcels"),
      ]);
      const cleaned = cleanBuildings(buildingFeatures);
      const info = matchBuildingInfo(cleaned.features, addressPoints, parcels);
      const dataSource = await Cesium.GeoJsonDataSource.load(cleaned);
      return { dataSource, info };
    }

    loadEverything()
      .then(({ dataSource, info }) => {
      for (const entity of dataSource.entities.values) {
        const p = entity.properties;
        const b = {
          entity,
          stories: p.NUMBERSTORIES.getValue(),
          heightFt: p["BUILDINGHEIGHT (ft)"].getValue(),
          code: p.STRUCTURE.getValue(),
          occupied: p.OCCUPIEDDATE.getValue(),
          material: new Cesium.ColorMaterialProperty(),
        };
        b.group = Math.floor(b.code / 100);
        buildings.push(b);

        // Clean info box shown when a building is clicked.
        const typeName = structureNames[b.code] || `Code ${b.code}`;
        const extra = info.get(p.OBJECTID.getValue()) || { names: [], addresses: [], owners: [], yearBuilt: null };
        const built =
          extra.yearBuilt ? extra.yearBuilt :
          b.occupied      ? `${b.occupied.slice(0, 4)} (year occupied)` : "Unknown";
        entity.name = extra.names[0] || typeName;  // title of the info box
        entity.description = `
          <table class="cesium-infoBox-defaultTable"><tbody>
            <tr><th>Building / business</th><td>${listHtml(extra.names, 4)}</td></tr>
            <tr><th>Owner</th><td>${listHtml(extra.owners, 3)}</td></tr>
            <tr><th>Year built</th><td>${built}</td></tr>
            <tr><th>Address</th><td>${listHtml(extra.addresses, 2)}</td></tr>
            <tr><th>Stories</th><td>${b.stories}</td></tr>
            <tr><th>Height</th><td>${b.heightFt} ft</td></tr>
            <tr><th>Structure type</th><td>${typeName}</td></tr>
          </tbody></table>`;

        // Turn each flat footprint into a 3D block sitting on the terrain.
        const polygon = entity.polygon;
        polygon.material = b.material;
        polygon.outline = false; // outlines can't be drawn on terrain in Cesium
        polygon.heightReference = Cesium.HeightReference.CLAMP_TO_GROUND;
        polygon.extrudedHeightReference = Cesium.HeightReference.RELATIVE_TO_GROUND;
        polygon.extrudedHeight = b.heightFt * FEET_TO_METERS;
      }

      setupControls();
      viewer.dataSources.add(dataSource);
      // Zoom to downtown, tilted so the building heights are visible.
      viewer.flyTo(dataSource, {
        offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 0),
      });
    })
    .catch((err) => {
      console.error(err);
      $("count").textContent = "Couldn't load buildings from the City of Sioux Falls server. Try reloading the page.";
    });

    // ---------------------------------------------------------------------
    // Controls
    // ---------------------------------------------------------------------
    let maxHeight, maxStories;
    const defaultTypeColors = {};  // so "Reset all" can restore the type colors

    function setupControls() {
      maxHeight = Math.ceil(Math.max(...buildings.map((b) => b.heightFt)));
      maxStories = Math.max(...buildings.map((b) => b.stories));
      for (const id of ["hMin", "hMax"]) { $(id).min = 0; $(id).max = maxHeight; }
      for (const id of ["sMin", "sMax"]) { $(id).min = 1; $(id).max = maxStories; }

      // Stories legend (matches the QGIS legend).
      $("storiesLegend").innerHTML = storyClasses.map((c) =>
        `<label><span class="swatch" style="background:${c.color}"></span>${c.label}</label>`).join("");

      // One row per building type found in the data: checkbox + color picker + count.
      // An "All" checkbox first, to check or uncheck every type at once.
      const groupsInData = [...new Set(buildings.map((b) => b.group))].sort();
      $("typeList").innerHTML =
        `<label class="allRow"><input type="checkbox" id="typeAll" checked> All (${buildings.length})</label>` +
        groupsInData.map((g) => {
        const n = buildings.filter((b) => b.group === g).length;
        const info = typeGroups[g] || { label: `Other (${g}xx)`, color: "#a0a0a0" };
        typeGroups[g] = info;
        defaultTypeColors[g] = info.color;
        return `<div class="typeRow">
            <label><input type="checkbox" class="typeCheck" data-group="${g}" checked> ${info.label} (${n})</label>
            <input type="color" class="typeColor" data-group="${g}" value="${info.color}" title="Change color">
          </div>`;
      }).join("");

      // Redraw whenever any control changes.
      $("controls").addEventListener("input", (e) => {
        if (e.target.id === "typeAll") {
          document.querySelectorAll(".typeCheck").forEach((c) => (c.checked = e.target.checked));
        }
        if (e.target.classList.contains("typeColor")) {
          typeGroups[e.target.dataset.group].color = e.target.value;
          if ($("colorMode").value !== "type") $("colorMode").value = "type"; // show the change
        }
        keepRangeOrder(e.target.id);
        update();
      });
      $("reset").addEventListener("click", resetControls);
      $("toggle").addEventListener("click", () => {
        const collapsed = $("panel").classList.toggle("collapsed");
        $("toggle").textContent = collapsed ? "Show" : "Hide";
      });

      resetControls();
    }

    // Two-handle sliders: stop a handle from passing the other one.
    function keepRangeOrder(id) {
      const pairs = { hMin: "hMax", sMin: "sMax", hMax: "hMin", sMax: "sMin" };
      if (!pairs[id]) return;
      const isMin = id.endsWith("Min");
      const me = $(id), other = $(pairs[id]);
      if (isMin && +me.value > +other.value) me.value = other.value;
      if (!isMin && +me.value < +other.value) me.value = other.value;
    }

    // Draw the blue part between the two handles, and make sure a handle can
    // still be grabbed when both sit on the same spot.
    function drawDualSlider(minId, maxId, fillId) {
      const lo = $(minId), hi = $(maxId);
      const span = (+lo.max - +lo.min) || 1;
      const a = (+lo.value - +lo.min) / span, b = (+hi.value - +lo.min) / span;
      const thumb = 16; // px, matches the CSS handle size
      $(fillId).style.left = `calc(${a * 100}% + ${thumb / 2 - thumb * a}px)`;
      $(fillId).style.width = `calc(${(b - a) * 100}% - ${thumb * (b - a)}px)`;
      // Handles stacked at the far right: put "min" on top so it can be dragged back left.
      lo.style.zIndex = +lo.value >= +lo.max ? 2 : 1;
      hi.style.zIndex = 1;
    }

    function resetControls() {
      $("colorMode").value = "stories";
      $("singleColor").value = "#3388ff";
      $("alpha").value = 0;
      $("hMin").value = 0;  $("hMax").value = maxHeight;
      $("sMin").value = 1;  $("sMax").value = maxStories;
      document.querySelectorAll(".typeCheck").forEach((c) => (c.checked = true));
      document.querySelectorAll(".typeColor").forEach((c) => {
        c.value = defaultTypeColors[c.dataset.group];
        typeGroups[c.dataset.group].color = c.value;
      });
      update();
    }

    // Apply the current colors and filters to every building.
    function update() {
      const mode = $("colorMode").value;
      const alpha = 1 - $("alpha").value / 100;
      const hMin = +$("hMin").value, hMax = +$("hMax").value;
      const sMin = +$("sMin").value, sMax = +$("sMax").value;
      const checks = [...document.querySelectorAll(".typeCheck")];
      const shownGroups = new Set(checks.filter((c) => c.checked).map((c) => +c.dataset.group));

      // "All" is checked when every type is, and shows a dash when only some are.
      $("typeAll").checked = shownGroups.size === checks.length;
      $("typeAll").indeterminate = shownGroups.size > 0 && shownGroups.size < checks.length;

      $("singleColorRow").hidden = mode !== "single";
      $("storiesLegend").hidden = mode !== "stories";
      $("alphaOut").textContent = `${$("alpha").value}%`;
      $("hOut").textContent = `${hMin} – ${hMax} ft`;
      $("sOut").textContent = sMin === sMax ? `${sMin}` : `${sMin} – ${sMax}`;
      drawDualSlider("hMin", "hMax", "hFill");
      drawDualSlider("sMin", "sMax", "sFill");

      let shown = 0;
      for (const b of buildings) {
        const visible =
          b.heightFt >= hMin && b.heightFt <= hMax &&
          b.stories >= sMin && b.stories <= sMax &&
          shownGroups.has(b.group);

        b.entity.show = visible;
        if (visible) shown++;
        if (!visible && viewer.selectedEntity === b.entity) viewer.selectedEntity = undefined;

        const css =
          mode === "stories" ? storiesColor(b.stories) :
          mode === "type"    ? typeGroups[b.group].color :
                               $("singleColor").value;
        b.material.color = Cesium.Color.fromCssColorString(css).withAlpha(alpha);
      }
      $("count").textContent = `Showing ${shown} of ${buildings.length} buildings`;
    }
  </script>
</body>
</html>
