name: Deploy to GitHub Pages

on:
  push:
    branches: [main]   # direct pushes and merged PRs both land here
  workflow_dispatch:   # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with Cesium token
        env:
          CESIUM_TOKEN: ${{ secrets.CESIUM_TOKEN }}
        run: |
          if [ -z "$CESIUM_TOKEN" ]; then
            echo "::error::Repository secret CESIUM_TOKEN is not set."
            exit 1
          fi
          mkdir _site
          cp index.html _site/   # building data is fetched live from the City in the browser
          sed -i "s|PASTE_CESIUM_TOKEN|${CESIUM_TOKEN}|" _site/index.html
          if grep -q PASTE_CESIUM_TOKEN _site/index.html; then
            echo "::error::Token placeholder was not replaced."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
